<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="560" viewBox="0 0 2400 560" fill="none" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">サンエイ 研磨メディア流動層 PC</title>
  <desc id="desc">研磨メディアが密集しながら流動し、手前ほど滑らかな面へ整っていく様子を、青一色の濃淡で表現した横長背景装飾。</desc>
  <defs>
    <linearGradient id="mist" x1="0" y1="70" x2="0" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4FB"/>
      <stop offset="1" stop-color="#CFE1F6"/>
    </linearGradient>
    <linearGradient id="front" x1="1200" y1="382" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3874BC"/>
      <stop offset="1" stop-color="#1F4E8C"/>
    </linearGradient>
  </defs>

